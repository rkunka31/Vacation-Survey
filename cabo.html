<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cabo 2026">
<meta name="theme-color" content="#c2700e">
<title>Cabo 2026 🌵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ── DESERT PALETTE ─────────────────────────────────────────────────── */
:root {
  --bg: #faf5ee;
  --surface: #fffdf9;
  --surface2: #f5ece0;
  --border: #e5d3bc;
  --border2: #eedfc8;
  --text: #3c1a00;
  --text2: #6b3a1f;
  --text3: #b8895a;
  --primary: #c2700e;
  --primary2: #9e5a0a;
  --orange: #e07b2a;
  --orange2: #c4630f;
  --green: #5d7a28;
  --amber: #c4950a;
  --red: #b91c1c;
  --wine: #7c1d1d;
  --wine2: #631515;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overscroll-behavior:none;}
#app{height:100%;display:flex;flex-direction:column;}

/* SCROLL */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(80px + var(--safe-bottom));}

/* HEADER */
.header{padding:calc(var(--safe-top) + 12px) 20px 12px;background:var(--bg);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.header-logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
.header-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--orange));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.header-title{font-family:'Outfit',sans-serif;font-weight:700;font-size:16px;color:var(--text);}
.header-sub{font-size:9px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;}
.header-actions{display:flex;gap:6px;align-items:center;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(60px + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;letter-spacing:.02em;transition:color .15s;padding-top:6px;}
.nav-item.active{color:var(--primary);}
.nav-item svg{width:22px;height:22px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:10px;}
.card-hover{transition:all .2s;cursor:pointer;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;transition:all .15s;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary2);}
.btn-secondary{background:var(--surface2);color:var(--text);border:1.5px solid var(--border);}
.btn-danger{background:rgba(185,28,28,.1);color:var(--red);border:1px solid rgba(185,28,28,.25);}
.btn-success{background:rgba(93,122,40,.1);color:var(--green);border:1px solid rgba(93,122,40,.25);}
.btn-wine{background:rgba(124,29,29,.1);color:var(--wine);border:1px solid rgba(124,29,29,.25);}
.btn-orange{background:rgba(224,123,42,.12);color:var(--orange);border:1px solid rgba(224,123,42,.25);}
.btn-full{width:100%;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}

/* INPUTS */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.input{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .15s;-webkit-appearance:none;}
.input:focus{border-color:var(--primary);}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
textarea.input{resize:none;line-height:1.5;}
select.input{cursor:pointer;}

/* RANGE SLIDER */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:var(--border);border-radius:3px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;border:2px solid #fff;}
input[type=range]:disabled{opacity:.4;}

/* SECTION LABEL */
.section-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-terra{background:rgba(194,112,14,.12);color:var(--primary);}
.badge-gold{background:rgba(196,149,10,.12);color:var(--amber);}
.badge-green{background:rgba(93,122,40,.12);color:var(--green);}
.badge-wine{background:rgba(124,29,29,.12);color:var(--wine);}
.badge-muted{background:rgba(184,137,90,.1);color:var(--text3);}
.must-return-badge{background:linear-gradient(135deg,rgba(194,112,14,.15),rgba(224,123,42,.1));color:var(--orange);border:1px solid rgba(194,112,14,.3);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}

/* SHEET */
.sheet-bg{position:fixed;inset:0;z-index:300;background:rgba(60,26,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:620px;max-height:96vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(24px + var(--safe-bottom));}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0;margin-bottom:16px;}
.sheet-title{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;color:var(--text);}
.sheet-body{padding:0 20px;}
.close-btn{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:none;color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}

/* TOAST */
.toast-wrap{position:fixed;bottom:calc(72px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;}
.toast{background:#3c1a00;color:#fffdf9;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.2);animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;}
.empty-icon{font-size:52px;margin-bottom:14px;}
.empty h3{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px;}
.empty p{font-size:14px;color:var(--text3);}

/* PROGRESS */
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--amber));transition:width .6s;}

/* PAGE */
.page-header{padding:20px 20px 10px;}
.page-title{font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;margin-bottom:2px;}
.page-sub{font-size:13px;color:var(--text3);}

/* STAT GRID */
.stat-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;}
.stat-num{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;color:var(--primary);line-height:1;}
.stat-label{font-size:11px;color:var(--text3);margin-top:4px;}

/* HERO */
.trip-hero{background:linear-gradient(135deg,#e07b2a,#c2700e,#7c1d1d);border-radius:20px;padding:24px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;}
.trip-hero::after{content:'🌵';position:absolute;right:16px;bottom:-4px;font-size:80px;opacity:.15;}
.trip-hero h1{font-family:'Outfit',sans-serif;font-size:28px;font-weight:800;margin-bottom:4px;}
.trip-hero p{font-size:13px;opacity:.85;}
.trip-hero .day-badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;margin-top:10px;}

/* TODAY PILL */
.today-pill{background:linear-gradient(90deg,var(--primary),var(--orange));color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;display:inline-block;}

/* DAY CARDS */
.day-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.day-card:active{transform:scale(.98);}
.day-card.today{border-color:var(--primary);background:rgba(194,112,14,.04);}
.day-card.past{opacity:.85;}
.day-card.future{opacity:.7;}

/* MEAL / WINE CARDS */
.meal-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.meal-card:active{transform:scale(.98);}
.wine-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.wine-card:active{transform:scale(.98);}

/* ACTIVITY ROW */
.activity-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2);}
.activity-row:last-child{border-bottom:none;}

/* PERSON ROW */
.person-order-row{padding:10px 0;border-bottom:1px solid var(--border2);}
.person-order-row:last-child{border-bottom:none;}
.person-row-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.person-row-inputs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.person-dish-input{flex:1;min-width:120px;background:var(--bg);border:1.5px solid var(--border2);color:var(--text);border-radius:8px;padding:8px 12px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .15s;}
.person-dish-input:focus{border-color:var(--primary);}

/* AVATAR */
.trav-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;flex-shrink:0;}

/* FILTER TABS */
.filter-tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding:0 16px 12px;scrollbar-width:none;}
.filter-tabs::-webkit-scrollbar{display:none;}
.filter-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text3);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .13s;}
.filter-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

/* RANKING */
.rank-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border2);}
.rank-item:last-child{border-bottom:none;}
.rank-medal{font-size:22px;width:28px;text-align:center;flex-shrink:0;}
.rank-num{width:28px;text-align:center;font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;color:var(--text3);flex-shrink:0;}

/* MOOD */
.mood-btns{display:flex;gap:6px;flex-wrap:wrap;}
.mood-btn{padding:8px 12px;border-radius:10px;border:1.5px solid var(--border);background:transparent;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .13s;}
.mood-btn.selected{border-color:var(--primary);background:rgba(194,112,14,.1);color:var(--primary);font-weight:600;}

/* TOGGLE */
.toggle-wrap{display:flex;align-items:center;gap:10px;}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;}
.toggle.on{background:var(--orange);}
.toggle-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-knob{left:23px;}

/* PHOTO */
.photo-preview{width:100%;max-height:200px;object-fit:contain;border-radius:10px;border:1px solid var(--border);margin-top:8px;}
.photo-placeholder{width:100%;height:100px;border-radius:10px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;cursor:pointer;background:var(--bg);}
.photo-placeholder span{font-size:28px;}
.photo-placeholder p{font-size:12px;color:var(--text3);}

/* APPLY ALL BOX */
.apply-all-box{background:rgba(194,112,14,.06);border:1.5px dashed rgba(194,112,14,.4);border-radius:12px;padding:12px;margin-bottom:12px;}

/* IMAGE OVERLAY */
.img-overlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.img-overlay img{max-width:100%;max-height:100%;object-fit:contain;}

/* SCORE INLINE */
.score-pill{display:inline-flex;align-items:baseline;gap:1px;}
.score-pill .num{font-family:'Outfit',sans-serif;font-weight:800;}
.score-pill .denom{font-size:11px;color:var(--text3);}
</style>
</head>
<body>
<div id="app">
  <div class="header" id="mainHeader"></div>
  <div class="scroll-area" id="scrollArea"></div>
  <nav class="bottom-nav" id="bottomNav">
    <div class="nav-item" id="nav-dashboard" onclick="App.setView('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span style="font-size:9px">Dashboard</span>
    </div>
    <div class="nav-item" id="nav-days" onclick="App.setView('days')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span style="font-size:9px">Days</span>
    </div>
    <div class="nav-item" id="nav-meals" onclick="App.setView('meals')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
      <span style="font-size:9px">Meals</span>
    </div>
    <div class="nav-item" id="nav-wine" onclick="App.setView('wine')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 22h8M12 22v-7M5 3h14l-3 7a4 4 0 01-8 0L5 3z"/></svg>
      <span style="font-size:9px">Wine</span>
    </div>
    <div class="nav-item" id="nav-rankings" onclick="App.setView('rankings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span style="font-size:9px">Best Of</span>
    </div>
  </nav>
</div>
<div class="toast-wrap" id="toastWrap" style="display:none"><div class="toast" id="toastMsg"></div></div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────────────
const ADULTS = ['Robert','Nicole','Jodie','Marcos','Kristen','Quinn','Larry'];
const KIDS   = ['Riley','Morgan'];
const TRAVELERS = [...ADULTS, ...KIDS];
const TRAV_COLORS = ['#6366f1','#f59e0b','#22c55e','#ec4899','#14b8a6','#c2700e','#8b5cf6','#06b6d4','#ef4444'];
const MEAL_TYPES = ['Breakfast','Lunch','Dinner','Drinks','Snack'];
const CUISINES   = ['Mexican','Seafood','Steakhouse','Italian','American','Asian','Mediterranean','International','Bar/Cantina','Other'];
const MOODS = [{v:'amazing',l:'🤩 Amazing'},{v:'great',l:'😁 Great'},{v:'good',l:'😊 Good'},{v:'meh',l:'😐 Meh'},{v:'rough',l:'😞 Rough'}];
const SK = 'cabo2026_v2';

// May 18–29 (12 active days; May 17 & May 30 are travel days, excluded)
const DAYS = (() => {
  const D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const out = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date('2026-05-18');
    d.setDate(d.getDate() + i);
    out.push({
      date: d.toISOString().slice(0,10),
      dayNum: i + 1,
      short: `${D[d.getDay()]} May ${d.getDate()}`,
      long: `Day ${i+1} — ${D[d.getDay()]}, May ${d.getDate()}`
    });
  }
  return out; // May 18 – May 29
})();

function todayStr()      { return new Date().toISOString().slice(0,10); }
function todayDayIndex() { return DAYS.findIndex(d => d.date === todayStr()); }
function travColor(n)    { const i = TRAVELERS.indexOf(n); return i >= 0 ? TRAV_COLORS[i] : '#94a3b8'; }
function travInit(n)     { return (n||'?')[0].toUpperCase(); }
function isKid(n)        { return KIDS.includes(n); }

// ── STORAGE ───────────────────────────────────────────────────────────────────
const DB = {
  load() { try { return JSON.parse(localStorage.getItem(SK) || '{}'); } catch { return {}; } },
  save(d) { try { localStorage.setItem(SK, JSON.stringify(d)); } catch {} }
};
function defaultDayData() {
  const obj = {};
  DAYS.forEach(d => { obj[d.date] = { activities:[], note:'', highlight:'', mood:'' }; });
  return obj;
}

// ── STATE ─────────────────────────────────────────────────────────────────────
const state = {
  view: 'dashboard', selectedDate: null, selectedMealId: null, mealFilter: 'All',
  meals: [], wines: [], dayData: defaultDayData()
};
(function init() {
  const s = DB.load();
  if (s.meals)   state.meals = s.meals;
  if (s.wines)   state.wines = s.wines;
  if (s.dayData) Object.keys(s.dayData).forEach(date => { if (state.dayData[date]) state.dayData[date] = s.dayData[date]; });
})();
function persist() { DB.save({ meals: state.meals, wines: state.wines, dayData: state.dayData }); }

// ── TOAST ─────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg, dur=2200) {
  const w=document.getElementById('toastWrap'), m=document.getElementById('toastMsg');
  m.textContent = msg; w.style.display = 'flex';
  clearTimeout(_tt); _tt = setTimeout(()=>w.style.display='none', dur);
}

// ── SCORE HELPERS ─────────────────────────────────────────────────────────────
// rating values: null = not rated, 'na' = N/A (not present), 0-100 = score
function scoreColor(r) {
  if (typeof r !== 'number') return 'var(--text3)';
  return r>=85?'var(--green)':r>=70?'var(--primary)':r>=55?'var(--amber)':r>=40?'var(--orange)':'var(--red)';
}
function scoreDisplay(r, size='md') {
  if (r === null || r === undefined) return `<span style="color:var(--text3);font-size:12px">—</span>`;
  if (r === 'na') return `<span style="font-size:11px;font-weight:600;color:#94a3b8;background:rgba(148,163,184,.12);border-radius:6px;padding:2px 6px">N/A</span>`;
  const sz = size==='sm'?14:size==='lg'?32:20;
  return `<span style="font-family:'Outfit',sans-serif;font-size:${sz}px;font-weight:800;color:${scoreColor(r)}">${r}</span><span style="font-size:11px;color:var(--text3)">/100</span>`;
}
function mealAvgRating(meal) {
  const rs = TRAVELERS.map(t=>meal.orders?.[t]?.rating).filter(r=>typeof r==='number');
  return rs.length ? Math.round(rs.reduce((a,b)=>a+b,0)/rs.length) : null;
}
function uid() { return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function formatPrice(p) { const n=parseFloat(p); return isNaN(n)?'—':'$'+n.toFixed(2).replace(/\.00$/,''); }
function mealsForDate(date) { return state.meals.filter(m=>m.date===date); }

function getBestRestaurants() {
  const map={};
  state.meals.forEach(m => {
    if (!m.restaurant) return;
    const k=m.restaurant.toLowerCase();
    if (!map[k]) map[k]={name:m.restaurant,cuisine:m.cuisine,ratings:[],visits:0,mustReturn:false};
    map[k].visits++;
    if (m.mustReturn) map[k].mustReturn=true;
    TRAVELERS.forEach(t=>{ const r=m.orders?.[t]?.rating; if(typeof r==='number') map[k].ratings.push(r); });
  });
  return Object.values(map)
    .map(r=>({...r,avg:r.ratings.length?Math.round(r.ratings.reduce((a,b)=>a+b,0)/r.ratings.length):null}))
    .filter(r=>r.avg!==null).sort((a,b)=>b.avg-a.avg);
}
function getBestDishes() {
  const out=[];
  state.meals.forEach(m=>{
    TRAVELERS.forEach(t=>{
      const o=m.orders?.[t];
      if(o?.dish && typeof o.rating==='number') out.push({dish:o.dish,person:t,restaurant:m.restaurant,date:m.date,rating:o.rating,mealType:m.mealType});
    });
  });
  return out.sort((a,b)=>b.rating-a.rating);
}
function getPersonStats() {
  const stats={};
  TRAVELERS.forEach(t=>{
    const rs=[], dishes=[];
    state.meals.forEach(m=>{
      const o=m.orders?.[t];
      if(typeof o?.rating==='number') rs.push(o.rating);
      if(o?.dish) dishes.push({dish:o.dish,rating:o.rating??null,restaurant:m.restaurant});
    });
    const topDish=[...dishes].filter(d=>typeof d.rating==='number').sort((a,b)=>b.rating-a.rating)[0];
    stats[t]={avg:rs.length?Math.round(rs.reduce((a,b)=>a+b,0)/rs.length):null,count:rs.length,topDish};
  });
  return stats;
}
function getWineStats() {
  const total=state.wines.reduce((s,w)=>s+(parseFloat(w.pricePerBottle)||0),0);
  return {total,count:state.wines.length};
}

      <div class="card" style="margin-bottom:10px">
        <div class="section-label">Orders — Kids</div>${makeRows(KIDS)}</div>
      ${meal.overallNotes?`<div class="card" style="margin-bottom:10px;background:rgba(194,112,14,.03)">
        <div class="section-label">Notes</div>
        <div style="font-size:14px;color:var(--text2);line-height:1.7">${meal.overallNotes}</div></div>`:''}
    </div>`;
  },

  wine() {
    const ws = getWineStats();
    document.getElementById('mainHeader').innerHTML = `
      <div class="header-logo"><div class="header-icon">🌵</div>
        <div><div class="header-title">Wine Log</div><div class="header-sub">${ws.count} bottle${ws.count!==1?'s':''}</div></div>
      </div>
      <div class="header-actions"><button class="btn btn-sm btn-wine" onclick="App.openAddWine()">+ Wine</button></div>`;

    if (!state.wines.length) return `<div class="empty" style="margin-top:40px"><div class="empty-icon">🍷</div><h3>No wines yet</h3><p>Log your first Cabo wine</p></div>`;

    const sorted = [...state.wines].sort((a,b)=>a.date<b.date?1:-1);
    let html = `<div style="background:linear-gradient(135deg,var(--wine),var(--wine2));border-radius:16px;padding:18px;margin:16px 16px 10px;color:#fffdf9">
      <div style="font-size:13px;opacity:.75;margin-bottom:4px">Total Wine Spend</div>
      <div style="font-family:'Outfit',sans-serif;font-size:36px;font-weight:800;line-height:1">${formatPrice(ws.total)}</div>
      <div style="font-size:12px;opacity:.7;margin-top:4px">${ws.count} bottle${ws.count!==1?'s':''} · avg ${ws.count>0?formatPrice(ws.total/ws.count):'—'} each</div>
    </div><div style="padding:0 16px">`;

    sorted.forEach(w=>{
      const dayInfo = DAYS.find(d=>d.date===w.date);
      html += `<div class="wine-card" onclick="App.editWine('${w.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="flex:1">
            <div style="font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;color:var(--wine);margin-bottom:3px">🍷 ${w.name||'Unnamed'}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">
              ${w.varietal?`<span class="badge badge-wine">${w.varietal}</span>`:''}
              ${w.vintage?`<span class="badge" style="background:rgba(124,29,29,.08);color:var(--wine2)">${w.vintage}</span>`:''}
              ${dayInfo?`<span class="badge badge-muted">${dayInfo.short}</span>`:''}
            </div>
            ${w.restaurant?`<div style="font-size:12px;color:var(--text3)">📍 ${w.restaurant}</div>`:''}
            ${w.notes?`<div style="font-size:12px;color:var(--text3);font-style:italic;margin-top:3px">${w.notes}</div>`:''}
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;color:var(--wine)">${formatPrice(w.pricePerBottle)}</div>
            <div style="font-size:11px;color:var(--text3)">/bottle</div>
          </div>
        </div></div>`;
    });
    return html + '</div>';
  },

  rankings() {
    document.getElementById('mainHeader').innerHTML = `
      <div class="header-logo"><div class="header-icon">🌵</div>
        <div><div class="header-title">Best Of Cabo</div><div class="header-sub">Command Center</div></div>
      </div>
      <div class="header-actions"><button class="btn btn-sm btn-primary" onclick="App.showReport()">📄 Report</button></div>`;

    const bestRests = getBestRestaurants();
    const bestDishes = getBestDishes().slice(0,10);
    const pStats = getPersonStats();
    const ws = getWineStats();
    const medals = ['🥇','🥈','🥉'];

    const restsHtml = bestRests.length ? bestRests.slice(0,8).map((r,i)=>`
      <div class="rank-item">
        <div class="rank-medal">${i<3?medals[i]:''}</div>
        ${i>=3?`<div class="rank-num">${i+1}</div>`:''}

          <div style="height:4px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden"><div style="height:4px;border-radius:2px;background:${scoreColor(r.avg)};width:${r.avg}%"></div></div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;color:${scoreColor(r.avg)}">${r.avg}</div>
          <div style="font-size:10px;color:var(--text3)">/100</div>
        </div></div>`).join('') :
      `<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">Log meals with scores to see rankings</div>`;

    const dishesHtml = bestDishes.length ? bestDishes.map((d,i)=>{
      const c = travColor(d.person);
      return `<div class="rank-item">
        <div class="rank-medal">${i<3?medals[i]:''}</div>
        ${i>=3?`<div class="rank-num">${i+1}</div>`:''}
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${d.dish}</div>
          <div style="font-size:12px;color:var(--text3)"><span style="color:${c};font-weight:600">${d.person}</span> · ${d.restaurant||'?'}${d.mealType?' · '+d.mealType:''}</div>
        </div>
        <div>${scoreDisplay(d.rating,'sm')}</div></div>`;
    }).join('') : `<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">No scored dishes yet</div>`;

    const sortedTravs = TRAVELERS.map(t=>({name:t,...pStats[t]})).filter(t=>t.avg!==null).sort((a,b)=>b.avg-a.avg);
    const travHtml = sortedTravs.length ? sortedTravs.map((t,i)=>{
      const c = travColor(t.name);
      return `<div class="rank-item">
        ${i<3?`<div class="rank-medal">${medals[i]}</div>`:`<div class="rank-num">${i+1}</div>`}
        <div class="trav-avatar" style="background:${c}22;border:2px solid ${c};color:${c};font-size:12px;width:30px;height:30px">${travInit(t.name)}</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${t.name}${isKid(t.name)?' 🧒':''}</div>
          ${t.topDish?`<div style="font-size:12px;color:var(--text3)">Fave: ${t.topDish.dish} @ ${t.topDish.restaurant||'?'}</div>`:''}
        </div>
        <div style="text-align:right">
          <div style="font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;color:${scoreColor(t.avg)}">${t.avg}</div>
          <div style="font-size:10px;color:var(--text3)">${t.count} scored</div>
        </div></div>`;
    }).join('') : `<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">Score meals to build the leaderboard</div>`;

    const sortedWines = [...state.wines].sort((a,b)=>(parseFloat(b.pricePerBottle)||0)-(parseFloat(a.pricePerBottle)||0));
    const wineHtml = sortedWines.length ? sortedWines.slice(0,5).map((w,i)=>`
      <div class="rank-item">
        ${i<3?`<div class="rank-medal">${medals[i]}</div>`:`<div class="rank-num">${i+1}</div>`}
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${w.name||'Unnamed'}${w.vintage?' ('+w.vintage+')':''}</div>
          <div style="font-size:12px;color:var(--text3)">${w.varietal||''}${w.varietal&&w.restaurant?' · ':''}${w.restaurant||''}</div>
        </div>
        <div style="font-family:'Outfit',sans-serif;font-size:18px;font-weight:800;color:var(--wine)">${formatPrice(w.pricePerBottle)}</div>
      </div>`).join('') : `<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">No wines logged yet</div>`;

    return `<div class="page-header"><div class="page-title">🏆 Best Of Cabo</div><div class="page-sub">${state.meals.length} meals · ${state.wines.length} wines</div></div>
    <div style="padding:0 16px">
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="section-label" style="margin-bottom:0">🍽 Best Restaurants</div>
          <span style="font-size:12px;color:var(--text3)">${bestRests.length} ranked</span>
        </div>${restsHtml}</div>
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="section-label" style="margin-bottom:0">⭐ Best Dishes</div>
          <span style="font-size:12px;color:var(--text3)">Top ${Math.min(bestDishes.length,10)}</span>
        </div>${dishesHtml}</div>
      <div class="card" style="margin-bottom:10px">
        <div class="section-label" style="margin-bottom:12px">😋 Traveler Scoreboard</div>
        ${travHtml}</div>
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div class="section-label" style="margin-bottom:0">🍷 Top Wines</div>
          ${ws.count>0?`<span style="font-size:13px;font-weight:700;color:var(--wine)">${formatPrice(ws.total)} total</span>`:''}
        </div>${wineHtml}</div>
      <button class="btn btn-primary btn-full" onclick="App.showReport()" style="margin-bottom:16px;padding:14px">📄 Export Full Trip Report</button>
    </div>`;
  }
};

// ── SHEETS ────────────────────────────────────────────────────────────────────
function openSheet(title, content, onClose) {
  let o = document.getElementById('sheetOverlay');
  if (!o) { o = document.createElement('div'); o.id = 'sheetOverlay'; document.body.appendChild(o); }
  o.className = 'sheet-bg';
  o.innerHTML = `<div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-header"><div class="sheet-title">${title}</div><button class="close-btn" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body" id="sheetBody">${content}</div></div>`;
  o.style.display = 'flex';
  o.onclick = e => { if (e.target === o) closeSheet(); };
  window._sheetOnClose = onClose;
}
function closeSheet() {
  const o = document.getElementById('sheetOverlay');
  if (o) o.style.display = 'none';
  if (window._sheetOnClose) { window._sheetOnClose(); window._sheetOnClose = null; }
}

// ── MEAL SHEET ────────────────────────────────────────────────────────────────
window._mealForm = {};

function buildMealSheet(prefill = {}) {
  const ti = todayDayIndex();
  const dateVal = prefill.date || state._addMealDate || DAYS[ti >= 0 ? ti : 0]?.date || DAYS[0].date;
  window._mealForm = {
    id: prefill.id || null,
    date: dateVal,
    restaurant: prefill.restaurant || '',
    cuisine: prefill.cuisine || '',
    mealType: prefill.mealType || 'Dinner',
    overallNotes: prefill.overallNotes || '',
    totalBill: prefill.totalBill || '',
    mustReturn: prefill.mustReturn || false,
    menuPhoto: prefill.menuPhoto || null,
    orders: {}
  };
  TRAVELERS.forEach(t => {
    const existing = prefill.orders?.[t];
    window._mealForm.orders[t] = existing
      ? { dish: existing.dish || '', rating: existing.rating !== undefined ? existing.rating : null }
      : { dish: '', rating: null };
  });
  return renderMealSheetHTML();
}

function renderMealSheetHTML() {
  const f = window._mealForm;
  const dayOpts   = DAYS.map(d=>`<option value="${d.date}"${f.date===d.date?' selected':''}>${d.long}</option>`).join('');
  const cuisineOpts = CUISINES.map(c=>`<option${f.cuisine===c?' selected':''}>${c}</option>`).join('');
  const typeOpts  = MEAL_TYPES.map(t=>`<option${f.mealType===t?' selected':''}>${t}</option>`).join('');

  const photoSec = f.menuPhoto
    ? `<img src="${f.menuPhoto}" class="photo-preview" id="menuPhotoPreview">
       <button class="btn btn-sm btn-danger" onclick="window._mealForm.menuPhoto=null;document.getElementById('menuPhotoPreview').remove();this.remove()" style="margin-top:6px">Remove Photo</button>`
    : `<div class="photo-placeholder" onclick="document.getElementById('menuPhotoInput').click()">
         <span>📷</span><p>Tap to attach menu photo (reference only)</p>
       </div>
       <input type="file" id="menuPhotoInput" accept="image/*" style="display:none" onchange="App.handleMenuPhoto(this)">`;

  const personRows = TRAVELERS.map(t => {
    const o = f.orders[t] || { dish:'', rating:null };
    const c = travColor(t);
    return `<div class="person-order-row">
      <div class="person-row-header">
        <div class="trav-avatar" style="background:${c}22;border:2px solid ${c};color:${c};font-size:11px;width:28px;height:28px;font-weight:700">${travInit(t)}</div>
        <span style="font-weight:600;font-size:14px;color:${c}">${t}${isKid(t)?' 🧒':''}</span>
      </div>
      <div class="person-row-inputs">
        <input class="person-dish-input" id="dish-${t}" value="${o.dish||''}" placeholder="What did they order?" oninput="window._mealForm.orders['${t}'].dish=this.value">
        <div id="pscore-wrap-${t}" style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex-shrink:0">${personScoreHTML(t)}</div>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="field"><label>Day</label><select class="input" onchange="window._mealForm.date=this.value">${dayOpts}</select></div>
    <div class="field"><label>Restaurant / Venue</label><input class="input" id="ms-restaurant" value="${f.restaurant}" placeholder="e.g. Don Emiliano" oninput="window._mealForm.restaurant=this.value"></div>
    <div class="input-row">
      <div class="field"><label>Meal Type</label><select class="input" onchange="window._mealForm.mealType=this.value">${typeOpts}</select></div>
      <div class="field"><label>Cuisine</label><select class="input" onchange="window._mealForm.cuisine=this.value"><option value="">—</option>${cuisineOpts}</select></div>
    </div>
    <div class="input-row">
      <div class="field"><label>Total Bill ($)</label><input class="input" type="number" id="ms-bill" value="${f.totalBill}" placeholder="0.00" oninput="window._mealForm.totalBill=this.value"></div>
      <div class="field" style="display:flex;align-items:flex-end;padding-bottom:14px">
        <div class="toggle-wrap">
          <button class="toggle${f.mustReturn?' on':''}" id="mustReturnToggle" onclick="App.toggleMustReturn()"><div class="toggle-knob"></div></button>
          <span style="font-size:13px;font-weight:600;color:var(--orange)">⭐ Must Return</span>
        </div>
      </div>
    </div>
    <div class="field"><label>Menu Photo (Reference)</label>${photoSec}</div>

    <div class="section-label">Orders &amp; Scores — Adults &amp; Kids</div>
    <div class="apply-all-box">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">⚡ Same Dish for Everyone?</div>
      <div style="display:flex;gap:8px">
        <input class="input" id="applyAllDish" placeholder="e.g. Pizza Margherita, Fish Tacos…" style="flex:1;padding:9px 12px;font-size:14px">
        <button class="btn btn-primary btn-sm" onclick="App.applyAllDish()">Fill All →</button>
      </div>
    </div>

    <div style="background:var(--bg);border-radius:12px;padding:0 12px;margin-bottom:14px">${personRows}</div>

    <div class="field"><label>Notes</label><textarea class="input" id="ms-notes" rows="2" placeholder="Anything memorable about this meal..." oninput="window._mealForm.overallNotes=this.value">${f.overallNotes}</textarea></div>
    <div style="display:flex;gap:10px;margin-top:6px;padding-bottom:6px">
      <button class="btn btn-secondary" onclick="closeSheet()" style="flex:1">Cancel</button>
      <button class="btn btn-primary" onclick="App.saveMeal()" style="flex:2">💾 Save Meal</button>
    </div>`;
}

// ── REPORT ────────────────────────────────────────────────────────────────────
function buildReport() {
  const meals = state.meals, wines = state.wines;
  const ws = getWineStats();
  const bestRests = getBestRestaurants();
  const bestDishes = getBestDishes().slice(0,10);
  const pStats = getPersonStats();
  const totalActs = DAYS.reduce((s,d)=>s+(state.dayData[d.date]?.activities?.length||0),0);
  const medals = ['🥇','🥈','🥉'];

  function sc(r) {
    if (r===null||r===undefined) return '<span style="color:#94a3b8;font-size:12px">—</span>';
    if (r==='na') return '<span style="font-size:11px;color:#94a3b8">N/A</span>';
    const c=r>=85?'#5d7a28':r>=70?'#c2700e':r>=55?'#c4950a':r>=40?'#e07b2a':'#b91c1c';
    return `<span style="font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;color:${c}">${r}</span><span style="font-size:11px;color:#94a3b8">/100</span>`;
  }
  function sbar(r) {
    if (r===null) return '';
    const c=r>=85?'#5d7a28':r>=70?'#c2700e':r>=55?'#c4950a':r>=40?'#e07b2a':'#b91c1c';
    return `<div style="height:5px;background:#f1f5f9;border-radius:3px;margin-top:4px"><div style="height:5px;border-radius:3px;background:${c};width:${r}%"></div></div>`;
  }

  const restRows = bestRests.map((r,i)=>`
    <div style="padding:10px 0;border-bottom:1px solid #f1f5f9">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:20px">${i<3?medals[i]:(i+1)+'.'}</span>
          <div><div style="font-weight:700;font-size:15px">${r.name}</div>
          <div style="font-size:12px;color:#64748b">${r.cuisine||''}${r.cuisine&&r.visits?' · ':''}${r.visits} visit${r.visits!==1?'s':''}${r.mustReturn?' · ⭐ Must Return':''}</div></div>
        </div>
        <div>${sc(r.avg)}</div>
      </div>${sbar(r.avg)}</div>`).join('');

  const dishRows = bestDishes.map((d,i)=>{
    const c=travColor(d.person);
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">
      <span style="font-size:18px">${i<3?medals[i]:(i+1)+'.'}</span>
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${d.dish}</div>
      <div style="font-size:12px;color:#64748b"><span style="color:${c};font-weight:600">${d.person}</span> · ${d.restaurant||'?'}${d.mealType?' · '+d.mealType:''}</div></div>
      <div>${sc(d.rating)}</div></div>`;
  }).join('');

  const dayRows = DAYS.map(day=>{
    const dd=state.dayData[day.date]; const dms=mealsForDate(day.date); const acts=dd?.activities||[];
    if (!dd?.mood&&!dms.length&&!acts.length) return '';
    const mood=dd?.mood?MOODS.find(m=>m.v===dd.mood)?.l:'';
    return `<div style="padding:12px 0;border-bottom:1px solid #f1f5f9">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px">${day.long} ${mood||''}</div>
      ${dd?.highlight?`<div style="color:#c2700e;font-size:13px;margin-bottom:6px">✨ ${dd.highlight}</div>`:''}
      ${acts.length?`<div style="font-size:12px;color:#475569;margin-bottom:4px">🎯 ${acts.map(a=>a.name+(a.rating!==null&&a.rating!==undefined?' ('+a.rating+'/100)':'')).join(', ')}</div>`:''}
      ${dms.length?`<div style="font-size:12px;color:#475569">🍽 ${dms.map(m=>m.restaurant+(mealAvgRating(m)!==null?' ('+mealAvgRating(m)+'/100)':'')).join(', ')}</div>`:''}
      ${dd?.note?`<div style="font-size:12px;color:#94a3b8;font-style:italic;margin-top:4px">${dd.note}</div>`:''}
    </div>`;
  }).join('');

  const mealRows = [...meals].sort((a,b)=>a.date<b.date?-1:1).map(m=>{
    const avg=mealAvgRating(m); const dayInfo=DAYS.find(d=>d.date===m.date);
    const orders=TRAVELERS.filter(t=>m.orders?.[t]?.dish).map(t=>{
      const o=m.orders[t];
      return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0">
        <span style="font-size:12px;font-weight:600;color:${travColor(t)};min-width:60px">${t}</span>
        <span style="font-size:13px;flex:1">${o.dish}</span>
        ${o.rating!==null&&o.rating!==undefined&&o.rating!=='na'?`<span style="font-size:12px;font-weight:700;color:${o.rating>=85?'#5d7a28':o.rating>=70?'#c2700e':'#c4950a'}">${o.rating}/100</span>`:(o.rating==='na'?'<span style="font-size:11px;color:#94a3b8">N/A</span>':'')}
      </div>`;
    }).join('');
    return `<div style="padding:12px 0;border-bottom:1px solid #f1f5f9">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div><div style="font-weight:700;font-size:16px">${m.restaurant||'Unnamed'}</div>
        <div style="font-size:12px;color:#64748b">${m.mealType}${m.cuisine?' · '+m.cuisine:''}${dayInfo?' · '+dayInfo.short:''}</div></div>
        ${avg!==null?`<div style="font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;color:${avg>=85?'#5d7a28':avg>=70?'#c2700e':'#c4950a'}">${avg}<span style="font-size:12px;color:#94a3b8">/100</span></div>`:''}
      </div>
      ${m.mustReturn?'<div style="display:inline-block;background:rgba(194,112,14,.1);color:#c2700e;border:1px solid rgba(194,112,14,.3);border-radius:12px;padding:2px 10px;font-size:11px;font-weight:700;margin-bottom:6px">⭐ Must Return!</div>':''}
      ${orders?`<div style="background:#f8fafc;border-radius:8px;padding:8px 10px">${orders}</div>`:''}
      ${m.overallNotes?`<div style="font-size:12px;color:#94a3b8;font-style:italic;margin-top:6px">${m.overallNotes}</div>`:''}
      ${m.totalBill?`<div style="font-size:12px;color:#64748b;margin-top:4px">Bill: $${m.totalBill}</div>`:''}
    </div>`;
  }).join('');

  const wineRows = [...wines].sort((a,b)=>a.date<b.date?-1:1).map(w=>{
    const dayInfo=DAYS.find(d=>d.date===w.date);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9">
      <div><div style="font-weight:600;font-size:14px">🍷 ${w.name||'Unnamed'}${w.vintage?' ('+w.vintage+')':''}</div>
      <div style="font-size:12px;color:#64748b">${w.varietal||''}${w.varietal&&w.restaurant?' · ':''}${w.restaurant||''}${dayInfo?' · '+dayInfo.short:''}</div>
      ${w.notes?`<div style="font-size:12px;color:#94a3b8;font-style:italic">${w.notes}</div>`:''}</div>
      <div style="font-family:'Outfit',sans-serif;font-size:18px;font-weight:800;color:#7c1d1d">${formatPrice(w.pricePerBottle)}</div>
    </div>`;
  }).join('');

  const travStats = TRAVELERS.map(t=>{
    const s=pStats[t]; if (!s.avg) return '';
    const c=travColor(t);
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">
      <div style="width:30px;height:30px;border-radius:50%;background:${c}22;border:2px solid ${c};display:flex;align-items:center;justify-content:center;font-weight:700;color:${c};font-size:12px;flex-shrink:0">${travInit(t)}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${t}${isKid(t)?' 🧒':''}</div>
      ${s.topDish?`<div style="font-size:12px;color:#64748b">Top: ${s.topDish.dish} @ ${s.topDish.restaurant||'?'}</div>`:''}</div>
      <div style="text-align:right"><div style="font-family:'Outfit',sans-serif;font-size:18px;font-weight:800;color:${s.avg>=85?'#5d7a28':s.avg>=70?'#c2700e':'#c4950a'}">${s.avg}</div>
      <div style="font-size:11px;color:#94a3b8">${s.count} scored</div></div>
    </div>`;
  }).join('');

  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabo 2026 — Trip Report</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#faf5ee;color:#3c1a00;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
@media print{.no-print{display:none!important;}body{background:#fff;}}
.wrap{max-width:700px;margin:0 auto;padding:20px;}
.print-bar{background:#3c1a00;color:#fffdf9;border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.print-bar p{font-size:13px;flex:1;}
.print-bar button{background:#c2700e;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.hero{background:linear-gradient(135deg,#e07b2a,#c2700e,#7c1d1d);border-radius:20px;padding:28px;color:#fff;margin-bottom:14px;position:relative;}
.hero::after{content:'🌵';position:absolute;right:20px;bottom:0;font-size:80px;opacity:.12;}
.hero h1{font-family:'Outfit',sans-serif;font-size:28px;font-weight:800;margin-bottom:4px;}
.section{background:#fff;border:1px solid #e5d3bc;border-radius:14px;padding:18px;margin-bottom:12px;}
.section h3{font-size:11px;font-weight:700;color:#b8895a;text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;}
.stat-row{display:flex;gap:12px;margin-bottom:12px;}
.stat-box{flex:1;background:#faf5ee;border:1px solid #e5d3bc;border-radius:10px;padding:12px;text-align:center;}
.stat-box .num{font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;color:#c2700e;}
.stat-box .lbl{font-size:11px;color:#b8895a;margin-top:2px;}
.footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:16px;padding-bottom:20px;}
</style></head><body>
<div class="wrap">
<div class="print-bar no-print"><p>Tap <strong>Share → Print</strong> (iPhone) or <strong>Ctrl+P</strong> to save as PDF.</p><button onclick="window.print()">🖨️ Print / Save PDF</button></div>
<div class="hero">
  <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:8px">Trip Report</div>
  <h1>Cabo 2026 🌵</h1>
  <p>Cabo San Lucas, Mexico · May 18–29, 2026</p>
  <p style="margin-top:4px">Robert, Nicole, Jodie, Marcos, Kristen, Quinn, Larry + Riley &amp; Morgan</p>
</div>
<div class="stat-row">
  ${[['🍽',meals.length,'Meals'],['🍷',wines.length,'Wines'],['🎯',totalActs,'Activities'],['💰',formatPrice(ws.total),'Wine Spend']].map(([ic,v,l])=>`<div class="stat-box"><div style="font-size:20px;margin-bottom:4px">${ic}</div><div class="num">${v}</div><div class="lbl">${l}</div></div>`).join('')}
</div>
${bestRests.length?`<div class="section"><h3>🏆 Best Restaurants</h3>${restRows}</div>`:''}
${bestDishes.length?`<div class="section"><h3>⭐ Best Dishes (Top ${bestDishes.length})</h3>${dishRows}</div>`:''}
${DAYS.some(d=>{const dd=state.dayData[d.date];return dd?.mood||mealsForDate(d.date).length||dd?.activities?.length;})?`<div class="section"><h3>📅 Day by Day</h3>${dayRows}</div>`:''}
${meals.length?`<div class="section"><h3>🍽 Complete Meal Log</h3>${mealRows}</div>`:''}
${wines.length?`<div class="section"><h3>🍷 Wine Log · Total: ${formatPrice(ws.total)}</h3>${wineRows}</div>`:''}
${travStats?`<div class="section"><h3>😋 Traveler Scoreboard</h3>${travStats}</div>`:''}
<div class="footer">Cabo 2026 Trip Report · Generated ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>
</div></body></html>`;
}

// ── APP CONTROLLER ────────────────────────────────────────────────────────────
const App = {
  setView(v) {
    state.view = v;
    const navMap = {'day-detail':'days','meal-detail':'meals'};
    const act = navMap[v]||v;
    ['dashboard','days','meals','wine','rankings'].forEach(id=>{
      const el=document.getElementById('nav-'+id);
      if (el) el.className='nav-item'+(act===id?' active':'');
    });
    document.getElementById('scrollArea').scrollTop = 0;
    this.render();
  },
  render() {
    const html = Views[state.view] ? Views[state.view]() : '';
    document.getElementById('scrollArea').innerHTML = html;
  },
  openDayDetail(date) { state.selectedDate=date; this.setView('day-detail'); },
  openMealDetail(id)  { state.selectedMealId=id; this.setView('meal-detail'); },
  setMealFilter(f)    { state.mealFilter=f; this.render(); },

  // DAY
  setMood(date, mood) {
    if (!state.dayData[date]) state.dayData[date]={activities:[],note:'',highlight:'',mood:''};
    state.dayData[date].mood = state.dayData[date].mood===mood?'':mood;
    persist(); this.render();
  },
  setHighlight(date, val) { if (state.dayData[date]) { state.dayData[date].highlight=val; persist(); } },
  setDayNote(date, val)   { if (state.dayData[date]) { state.dayData[date].note=val; persist(); } },

  // ACTIVITIES
  openAddActivity(date) { openSheet('Add Activity', buildActivitySheet(date)); },
  activateActRating() {
    window._actForm.rating = window._actForm._sv || 75;
    const el = document.getElementById('act-score-wrap');
    if (el) el.innerHTML = actScoreHTML();
  },
  updateActScore(val) {
    window._actForm.rating = parseInt(val);
    window._actForm._sv = parseInt(val);
    const el = document.getElementById('act-sv');
    if (el) { const r=parseInt(val); el.textContent=r; el.style.color=scoreColor(r); }
  },
  clearActRating() {
    window._actForm.rating = null;
    const el = document.getElementById('act-score-wrap');
    if (el) el.innerHTML = actScoreHTML();
  },
  saveActivity() {
    const f = window._actForm;
    const name = (document.getElementById('af-name')?.value||f.name).trim();
    if (!name) { toast('Enter an activity name'); return; }
    if (!state.dayData[f.date]) state.dayData[f.date]={activities:[],note:'',highlight:'',mood:''};
    state.dayData[f.date].activities.push({
      id:uid(), name,
      description: document.getElementById('af-desc')?.value||f.description,
      rating: f.rating,
      notes: document.getElementById('af-notes')?.value||f.notes
    });
    persist(); closeSheet(); toast('Activity saved');
    if (state.view==='day-detail') this.render();
  },
  removeActivity(date, idx) {
    if (!state.dayData[date]) return;
    state.dayData[date].activities.splice(idx,1);
    persist(); this.render(); toast('Removed');
  },

  // MEALS
  openAddMeal(date) { state._addMealDate=date||null; openSheet('Log a Meal',buildMealSheet()); },
  editMeal(id) {
    const m = state.meals.find(m=>m.id===id); if (!m) return;
    openSheet('Edit Meal', buildMealSheet(m), ()=>{ if(state.view==='meal-detail') this.render(); });
  },

  // Per-person score controls
  activatePersonRating(t) {
    if (!window._mealForm.orders[t]) window._mealForm.orders[t]={dish:'',rating:null};
    window._mealForm.orders[t].rating = 75;
    const el=document.getElementById(`pscore-wrap-${t}`); if(el) el.innerHTML=personScoreHTML(t);
  },
  setPersonNA(t) {
    if (!window._mealForm.orders[t]) window._mealForm.orders[t]={dish:'',rating:null};
    window._mealForm.orders[t].rating = 'na';
    const el=document.getElementById(`pscore-wrap-${t}`); if(el) el.innerHTML=personScoreHTML(t);
  },
  clearPersonRating(t) {
    if (!window._mealForm.orders[t]) return;
    window._mealForm.orders[t].rating = null;
    const el=document.getElementById(`pscore-wrap-${t}`); if(el) el.innerHTML=personScoreHTML(t);
  },
  updatePersonScore(val, t) {
    if (!window._mealForm.orders[t]) return;
    window._mealForm.orders[t].rating = parseInt(val);
    const el=document.getElementById(`sv-${t}`);
    if (el) { const r=parseInt(val); el.textContent=r; el.style.color=scoreColor(r); }
  },

  // Apply same dish to all
  applyAllDish() {
    const val = document.getElementById('applyAllDish')?.value?.trim();
    if (!val) { toast('Enter a dish name first'); return; }
    TRAVELERS.forEach(t=>{
      if (!window._mealForm.orders[t]) window._mealForm.orders[t]={dish:'',rating:null};
      window._mealForm.orders[t].dish = val;
      const inp=document.getElementById(`dish-${t}`); if(inp) inp.value=val;
    });
    toast(`"${val}" applied to all ${TRAVELERS.length} travelers!`);
  },

  toggleMustReturn() {
    window._mealForm.mustReturn = !window._mealForm.mustReturn;
    const btn=document.getElementById('mustReturnToggle');
    if (btn) btn.className='toggle'+(window._mealForm.mustReturn?' on':'');
  },
  handleMenuPhoto(input) {
    const file=input.files?.[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      window._mealForm.menuPhoto=ev.target.result;
      const sb=document.getElementById('sheetBody'); if(sb) sb.innerHTML=renderMealSheetHTML();
    };
    reader.readAsDataURL(file); input.value='';
  },
  saveMeal() {
    const f = window._mealForm;
    const rInp=document.getElementById('ms-restaurant'); if(rInp) f.restaurant=rInp.value.trim();
    TRAVELERS.forEach(t=>{ const inp=document.getElementById(`dish-${t}`); if(inp&&f.orders[t]) f.orders[t].dish=inp.value.trim(); });
    const notesInp=document.getElementById('ms-notes'); if(notesInp) f.overallNotes=notesInp.value;
    const billInp=document.getElementById('ms-bill'); if(billInp) f.totalBill=billInp.value;
    if (!f.restaurant && !TRAVELERS.some(t=>f.orders[t]?.dish)) { toast('Add a restaurant or at least one order'); return; }
    const meal={id:f.id||uid(),date:f.date,restaurant:f.restaurant,cuisine:f.cuisine,mealType:f.mealType,overallNotes:f.overallNotes,totalBill:f.totalBill,mustReturn:f.mustReturn,menuPhoto:f.menuPhoto,orders:f.orders};
    if (f.id) { state.meals=state.meals.map(m=>m.id===f.id?meal:m); toast('Meal updated'); }
    else { state.meals.push(meal); toast('Meal saved! 🍽'); }
    persist(); closeSheet(); this.render();
  },
  deleteMeal(id) {
    if (!confirm('Delete this meal?')) return;
    state.meals=state.meals.filter(m=>m.id!==id);
    persist(); toast('Deleted'); this.setView('meals');
  },
  viewPhoto(mealId) {
    const meal=state.meals.find(m=>m.id===mealId); if(!meal?.menuPhoto) return;
    const o=document.createElement('div'); o.className='img-overlay';
    o.innerHTML=`<img src="${meal.menuPhoto}"><div style="position:absolute;top:16px;right:16px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px" onclick="this.parentElement.remove()">✕</div>`;
    o.onclick=e=>{ if(e.target===o||e.target.tagName==='IMG') o.remove(); };
    document.body.appendChild(o);
  },

  // WINE
  openAddWine()  { openSheet('Log a Wine', buildWineSheet()); },
  editWine(id) {
    const w=state.wines.find(w=>w.id===id); if(!w) return;
    openSheet('Edit Wine', buildWineSheet(w));
  },
  saveWine() {
    const f=window._wineForm;
    ['wf-name','wf-var','wf-vin','wf-price','wf-rest','wf-notes'].forEach(id=>{
      const el=document.getElementById(id); if(!el) return;
      const key={['wf-name']:'name',['wf-var']:'varietal',['wf-vin']:'vintage',['wf-price']:'pricePerBottle',['wf-rest']:'restaurant',['wf-notes']:'notes'}[id];
      if(key) f[key]=el.value.trim()||el.value;
    });
    if (!f.name) { toast('Enter a wine name'); return; }
    const wine={id:f.id||uid(),date:f.date,name:f.name,varietal:f.varietal,vintage:f.vintage,restaurant:f.restaurant,pricePerBottle:f.pricePerBottle,notes:f.notes};
    if (f.id) { state.wines=state.wines.map(w=>w.id===f.id?wine:w); toast('Wine updated'); }
    else { state.wines.push(wine); toast('Wine logged! 🍷'); }
    persist(); closeSheet(); this.render();
  },

  // REPORT
  showReport() {
    const html=buildReport();
    const w=window.open('','_blank');
    if(w){ w.document.write(html); w.document.close(); }
    else {
      const blob=new Blob([html],{type:'text/html'});
      const url=URL.createObjectURL(blob);
      window.open(url,'_blank');
      setTimeout(()=>URL.revokeObjectURL(url),10000);
    }
  }
};

// ── INIT ──────────────────────────────────────────────────────────────────────
App.setView('dashboard');
</script>
</body>
</html>
